<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HOSTERA</title>
  <style>
    :root{
      --bg1:#FFFFFF;
      --bg2:#FFFFFF;
      --card:rgba(255, 255, 255, 0.95);
      --card2:#FFFFFF;
      --stroke:#E0E0E0;
      --stroke2:#CCCCCC;
      --text:#000000;
      --muted:#666666;
      --muted2:#999999;
      --chip:#F5F5F5;
      --chipActive:#E8F5E9;
      --good:#2f9d6a;
      --accent:#2f9d6a;
      --accentSoft:#4CAF50;
      --navAccent:#2F9D6A;
      --navActiveBg:#E8F5E9;
      --track:#EFE7DE;
      --shadow:0 2px 8px rgba(0,0,0,0.06);
      --radius:16px;
      --radius2:12px;
      --pad:24px;
      --gap:16px;
      --font: 'Proxima Nova', sans-serif;
    }
    :root[data-theme="dark"]{
      --bg1:#000000;
      --bg2:#000000;
      --card:rgba(30, 30, 30, 0.95);
      --card2:#2C2C2C;
      --stroke:#333333;
      --stroke2:#444444;
      --text:#FFFFFF;
      --muted:#B0B0B0;
      --muted2:#808080;
      --chip:#2C2C2C;
      --chipActive:#1B3A1F;
      --good:#4CAF50;
      --accent:#4CAF50;
      --accentSoft:#66BB6A;
      --navActiveBg:#1B3A1F;
      --track:#2C2C2C;
      --shadow:0 2px 8px rgba(0,0,0,0.3);
    }
    *{
      font-family: var(--font);
    }
    body{
      margin:0;
      background: var(--bg1);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .wrap{
      max-width:1240px;
      margin:0 auto;
      padding:22px 18px 70px;
    }
    .topbar{
      position: sticky;
      top: 0;
      z-index: 100;
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      align-items:center;
      gap:12px;
      padding:8px 18px;
      margin-bottom:14px;
      background:transparent;
      border:none;
      box-shadow:none;
    }
    .topbar::before{
      content:"";
      position:absolute;
      left:50%;
      margin-left:-50vw;
      width:100vw;
      top:-40px;
      bottom:-12px;
      z-index:-1;
      background: rgba(247,244,238,0.35);
      backdrop-filter: blur(6px) saturate(120%);
      -webkit-backdrop-filter: blur(6px) saturate(120%);
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 85%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 0%, #000 85%, transparent 100%);
      pointer-events:none;
    }
    [data-theme="dark"] .topbar::before{
      background: rgba(20,20,20,0.35);
    }
    [data-theme="dark"] .topbarBrand,
    [data-theme="dark"] .topbarNav,
    [data-theme="dark"] .topbarTools{
      background:#1c1c1e;
      border-color:rgba(255,255,255,0.08);
      box-shadow:0 6px 20px rgba(0,0,0,0.55);
    }
    [data-theme="dark"] .topMenuItem:hover:not([disabled]):not(.active),
    [data-theme="dark"] .toolBtn:hover,
    [data-theme="dark"] .searchField:hover:not(.expanded),
    [data-theme="dark"] .searchClearBtn:hover{
      background:rgba(255,255,255,0.10);
    }
    .topbarBrand,
    .topbarNav,
    .topbarTools{
      height:64px;
      box-sizing:border-box;
      background: var(--chip);
      border:1px solid var(--stroke);
      border-radius:20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .topbarBrand{
      display:flex;
      align-items:center;
      gap:14px;
      justify-self:start;
      min-width:0;
      padding:0 18px 0 6px;
    }
    .topbarBrand img{
      width:52px;
      height:52px;
      border-radius:14px;
      object-fit:contain;
      background: #F2EEE6;
      border:none;
      flex-shrink:0;
    }
    .topbarBrand .title{
      display:flex;
      flex-direction:column;
      line-height:1.1;
      min-width:0;
    }
    .topbarBrand .title b{
      font-size:20px;
      font-weight:600;
      color: var(--text);
      letter-spacing:0.2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .topbarNav{
      display:flex;
      align-items:center;
      gap:4px;
      justify-self:center;
      min-width:0;
      padding:0 6px;
      overflow-x:auto;
      scrollbar-width:none;
    }
    .topbarNav::-webkit-scrollbar{
      display:none;
    }
    .topMenuItem{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:5px;
      min-width:66px;
      padding:8px 14px;
      border:none;
      border-radius:20px;
      background:transparent;
      color:var(--muted);
      cursor:pointer;
      transition: background-color 180ms ease, color 180ms ease;
    }
    .topMenuItem .menuIcon,
    .topMenuItem .menuIcon svg{
      width:24px;
      height:24px;
    }
    .topMenuItem .menuIcon{
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .topMenuItem .menuLabel{
      font-size:12px;
      font-weight:500;
      white-space:nowrap;
      line-height:1;
    }
    .topMenuItem:hover:not([disabled]):not(.active){
      background: var(--card);
      color: var(--text);
    }
    .topMenuItem.active{
      background:var(--navActiveBg);
      color:var(--navAccent);
    }
    .topMenuItem[disabled]{
      opacity:0.4;
      cursor:not-allowed;
    }
    .topMenuItem:focus-visible{
      outline:2px solid var(--navAccent);
      outline-offset:2px;
    }
    .topbarTools{
      display:flex;
      align-items:center;
      gap:6px;
      justify-self:end;
      position:relative;
      padding:0 8px;
    }
    .toolBtn{
      width:48px;
      height:48px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border:none;
      border-radius:999px;
      background:transparent;
      color:var(--muted);
      font-size:20px;
      cursor:pointer;
      padding:0;
      transition: background-color 150ms ease, color 150ms ease;
    }
    .toolBtn:hover{
      background:var(--card);
      color:var(--text);
    }
    .toolBtn:focus-visible{
      outline:2px solid var(--navAccent);
      outline-offset:2px;
    }
    .toolBtn svg{
      width:20px;
      height:20px;
    }
    .searchField{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      width:48px;
      height:48px;
      border-radius:999px;
      background:transparent;
      cursor:pointer;
      overflow:hidden;
      box-sizing:border-box;
      transition: width 220ms ease, background-color 150ms ease;
    }
    .searchField:hover:not(.expanded){
      background:var(--card);
    }
    .searchField.expanded{
      width:240px;
      justify-content:flex-start;
      background:transparent;
      padding:0 8px 0 14px;
      cursor:text;
    }
    .searchField:focus-visible{
      outline:2px solid var(--navAccent);
      outline-offset:2px;
    }
    .searchIco,
    .searchIco svg{
      width:20px;
      height:20px;
    }
    .searchIco{
      flex-shrink:0;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--muted);
    }
    .searchField #searchInput{
      flex:1;
      min-width:0;
      height:100%;
      border:none;
      background:transparent;
      outline:none;
      color:var(--text);
      font-size:15px;
      font-weight:450;
      padding:0;
      box-sizing:border-box;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .searchField:not(.expanded) #searchInput{
      display:none;
    }
    .searchField #searchInput::placeholder{
      color:var(--muted);
      opacity:1;
    }
    .searchClearBtn{
      flex-shrink:0;
      width:26px;
      height:26px;
      border:none;
      border-radius:999px;
      background:transparent;
      color:var(--muted);
      font-size:16px;
      line-height:1;
      display:none;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      padding:0;
    }
    .searchClearBtn:hover{
      background:var(--card);
      color:var(--text);
    }
    .searchClearBtn:focus-visible{
      outline:2px solid var(--navAccent);
      outline-offset:1px;
    }
    .settingsPanel{
      position:absolute;
      top: calc(100% + 8px);
      right:0;
      min-width:150px;
      padding:8px;
      display:none;
      flex-direction:column;
      gap:4px;
      border-radius:12px;
      border:1px solid var(--stroke);
      background: var(--card);
      box-shadow: var(--shadow);
      z-index:120;
    }
    .settingsPanel.open{
      display:flex;
    }
    .settingsAction{
      height:34px;
      border:none;
      border-radius:8px;
      background:transparent;
      color:var(--text);
      font-size:14px;
      text-align:left;
      padding:0 10px;
      cursor:pointer;
    }
    .settingsAction:hover{
      background: var(--chip);
    }
    .hiddenControl{
      display:none !important;
    }
    .btn{
      cursor:pointer;
      border-radius: var(--radius2);
      border: 1px solid var(--stroke);
      background: var(--chip);
      color: var(--text);
      padding: 7px 10px;
      font-size: 12px;
      min-width: 100px;
    }
    .btn:hover{
      border-color: var(--stroke2);
    }
    .btn:focus-visible{
      outline:2px solid var(--accent);
      outline-offset:2px;
    }
    select, input{
      background: var(--card);
      border: 1px solid var(--stroke);
      color: var(--text);
      outline:none;
      border-radius: 12px;
      padding: 7px 10px;
      font-size: 12px;
      min-width: 100px;
    }
    .status{
      font-size: 12px;
      color: var(--muted);
      padding: 7px 10px;
      border-radius: 999px;
      border:1px solid var(--stroke);
      background: var(--card);
      display:flex;
      align-items:center;
      gap:8px;
    }
    .dot{
      width:8px;height:8px;border-radius: 999px;
      background: rgba(255,255,255,0.35);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.06);
    }
    .dot.good{
      background: var(--good);
      box-shadow: 0 0 0 3px rgba(116,255,182,0.13);
    }

    .tabs{
      position: sticky;
      top: var(--topbar-h, 80px);
      z-index: 99;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin: 12px 0 12px;
      padding: 12px 0;
      background: transparent;
    }
    .subsectionTabs{
      top: calc(var(--topbar-h, 80px) + var(--tabs-h, 56px));
      z-index: 98;
      margin-top: -8px;
      margin-bottom: 4px;
      padding-top: 8px;
      padding-bottom: 8px;
    }
    .subsectionTabs .chip{
      font-size: 11px;
      padding: 5px 10px;
      color: var(--muted2, #8A847B);
    }

    [data-theme="dark"] .card{
      background: rgba(30, 30, 30, 0.95);
      border-color: #333333;
    }

    [data-theme="dark"] .card .titleProducer,
    [data-theme="dark"] .card .titleWine,
    [data-theme="dark"] .card .infoLine,
    [data-theme="dark"] .card .priceLine,
    [data-theme="dark"] .card .priceLine .label,
    [data-theme="dark"] .card .priceLine .value,
    [data-theme="dark"] .card .noteLabel{
      color: #fff;
    }

    [data-theme="dark"] .card .infoLine .sep,
    [data-theme="dark"] .card .priceLine .sep,
    [data-theme="dark"] .card .divider,
    [data-theme="dark"] .card .noteTag{
      border-color: rgba(255,255,255,0.28);
      color: rgba(255,255,255,0.72);
    }

    [data-theme="dark"] .card .divider{
      background: rgba(255,255,255,0.28);
    }

    [data-theme="dark"] .card .infoLine .sep,
    [data-theme="dark"] .card .priceLine .sep{
      color: rgba(255,255,255,0.45);
    }

    @media (max-width: 1024px){
      .topbar{ gap:10px; }
    }
    @media (max-width: 767px){
      .topbar{
        grid-template-columns: 1fr auto;
        grid-template-areas: "brand tools" "nav nav";
        gap:8px 10px;
        border-radius:24px;
      }
      .topbarBrand{ grid-area:brand; }
      .topbarBrand img{ width:44px; height:44px; }
      .topbarBrand .title{ display:none; }
      .topbarTools{ grid-area:tools; }
      .topbarNav{
        grid-area:nav;
        justify-self:stretch;
        margin-left:0;
      }
      .topMenuItem{
        flex:1;
        min-width:0;
      }
      .searchField.expanded{ width:180px; }
    }

    /* chip as button (a11y) */
    .chip{
      cursor:pointer;
      user-select:none;
      padding:7px 12px;
      border-radius: 999px;
      border:1px solid var(--stroke);
      background: var(--chip);
      color: var(--muted);
      font-size: 12px;
      transition: 0.15s ease;
      text-transform: none;

      appearance:none;
      -webkit-appearance:none;
      outline:none;
    }
    .chip:hover{
      border-color: var(--stroke2);
      color: var(--text);
    }
    .chip.active{
      background: var(--navActiveBg);
      border-color: var(--navAccent);
      color: var(--navAccent);
    }
    .chip:focus-visible{
      outline:2px solid var(--navAccent);
      outline-offset:2px;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 460px));
      row-gap: 40px;
      column-gap: 72px;
      justify-content: center;
      justify-items: stretch;
      margin-top: 10px;
      padding: 0 18px;
    }
    .grid.pastryGrid{
      grid-template-columns: repeat(3, minmax(0, 1fr));
      column-gap: 28px;
      row-gap: 32px;
      justify-items: center;
    }
    @media (max-width: 930px){
      .grid{ grid-template-columns: 1fr; }
      input{ min-width: 160px; }

      .card{ padding: 16px; }
      .card:not(.pastryCard){ height: auto; }
      .cardLayout{ grid-template-columns: 1fr; gap: 16px; }
      .card:not(.pastryCard) .cardLayout{ width: 100%; max-width: none; }
      .bottleWrap{ min-height: 180px; padding: 12px; }
      .bottleImg{ max-height: 160px; }

      .name{ font-size: 13px; margin-bottom: 12px; }
      .infoRow{ grid-template-columns: 75px 1fr; gap: 8px; margin-bottom: 6px; }
      .infoLabel{ font-size: 9px; }
      .infoValue{ font-size: 11px; }

      .grid.pastryGrid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 680px){
      .card{ padding: 14px; }
      .card:not(.pastryCard){ height: auto; }
      .cardLayout{ grid-template-columns: 1fr; gap: 14px; }
      .bottleWrap{ width: 100%; min-height: 160px; padding: 10px; }
      .bottleImg{ max-height: 140px; }
      .name{ font-size: 12px; }
      .infoRow{ grid-template-columns: 1fr; gap: 2px; margin-bottom: 6px; }

      .grid.pastryGrid{ grid-template-columns: 1fr; }
    }

    .card{
      position:relative;
      box-sizing: border-box;
      border-radius: var(--radius);
      border:1px solid var(--stroke);
      background: var(--card);
      box-shadow: none;
      padding: 14px;
      width: 100%;
      max-width: 460px;
      min-height: auto;
      overflow:hidden;
      transition: border-color 0.2s ease;
    }
    .card:not(.pastryCard){
      height: auto;
    }
    .card:hover{ border-color: var(--stroke2); }
    .cardLayout{
      display:grid;
      grid-template-columns: 84px 1fr;
      gap: 28px;
      align-items:start;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }
    .card:not(.pastryCard) .cardLayout{
      width: calc(100% - 12px);
      max-width: 424px;
      margin: 0 auto;
    }
    .bottleWrap{
      width: 100%;
      height: auto;
      min-height: 200px;
      border-radius: var(--radius2);
      border: none;
      background: var(--bg2);
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 8px;
    }
    .bottleImg{
      max-height: 400px;
      max-width: 100%;
      object-fit: contain;
      transform: scale(1.2);
      transform-origin: center;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.08));
    }
    .meta{
      flex:1;
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:0;
    }
    .head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom: 24px;
    }
    .name{
      font-weight: 600;
      font-size: 14px;
      letter-spacing:0.3px;
      text-align: left;
      text-transform: uppercase;
      line-height: 1.25;
      margin-bottom: 10px;
      color: var(--text);
    }
    .titleProducer{
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 0;
      text-transform: uppercase;
      color: #1d1d1f;
      margin-bottom: 6px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
    }
    .titleWine{
      font-weight: 400;
      font-size: 16px;
      letter-spacing: 0;
      color: #86868b;
      line-height: 1.3;
      margin-bottom: 0;
      white-space: nowrap;
      overflow: hidden;
    }
    .producer{
      display: none;
    }
    .sub{
      font-size: 14px;
      color: var(--muted);
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }
    .cardDesc{
      font-size: 14px;
      color: var(--muted);
      line-height: 1.4;
      margin-top: 10px;
      white-space: normal;
    }
    .pastryCard{
      max-width: 400px;
      width: 100%;
      padding: 0;
      display: flex;
      flex-direction: column;
    }
    .pastryPhoto{
      position: relative;
      flex-shrink: 0;
      width: 100%;
      aspect-ratio: 1 / 1;
      box-sizing: border-box;
      padding: 8px;
      background: var(--bg2);
      border-bottom: 1px solid var(--stroke);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pastryImg{
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.08));
    }
    .pastryVisual{
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(170deg, #f7efe4 0%, #ead8c0 100%);
      color: #8a5d2d;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    [data-theme="dark"] .pastryVisual{
      background: linear-gradient(170deg, #2a2a2c 0%, #1c1c1e 100%);
      color: #8d8d92;
    }
    .pastryBody{
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px 18px 18px;
    }
    .pastryTitle{
      font-weight: 600;
      font-size: 18px;
      color: var(--text);
      line-height: 1.25;
      margin-bottom: 6px;
    }
    .pastryDescription{
      font-size: 14px;
      font-weight: 400;
      color: var(--muted);
      line-height: 1.4;
      text-align: justify;
    }
    .pastryFooter{
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: auto;
      padding-top: 14px;
    }
    .pastryPrice{
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      line-height: 1;
    }
    .pastryFooter .dietaryBadges{
      margin: 0;
    }
    .infoRow{
      display: grid;
      grid-template-columns: 70px 1fr;
      gap: 8px;
      align-items: baseline;
      margin-bottom: 8px;
    }
    .infoLabel{
      font-size: 12px;
      font-weight: 600;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .infoValue{
      font-size: 12px;
      font-weight: 400;
      color: #000;
      letter-spacing: 0.2px;
      line-height: 1.35;
    }
    .infoLine{
      font-size: 16px;
      font-weight: 400;
      color: #1d1d1f;
      line-height: 1.4;
      margin-bottom: 0;
    }
    .infoLine .sep{
      color: #d2d2d7;
      margin: 0 8px;
    }
    .priceLine{
      font-size: 16px;
      font-weight: 600;
      color: #1d1d1f;
      line-height: 1.4;
      margin-bottom: 0;
      margin-top: 12px;
    }
    .priceLine .label{
      font-weight: 400;
      color: #1d1d1f;
    }
    .priceLine .value{
      font-size: 16px;
      font-weight: 600;
      color: #1d1d1f;
    }
    .priceLine .sep{
      color: #d2d2d7;
      margin: 0 10px;
    }
    .countryFlag{
      width: 28px;
      height: 20px;
      object-fit: cover;
      border: 1px solid #CCCCCC;
      margin-right: 8px;
    }
    .priceStack{
      text-align:right;
      min-width: 88px;
      line-height:1.1;
    }
    .priceBottle{
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }
    .priceGlass{
      display:block;
      font-size: 14px;
      color: var(--muted);
      font-weight: 400;

function validateInventoryI18nCoverage() {
  const placeholderTokens = (value) => {
    const tokens = new Set();
    String(value || '').replace(/\{(\w+)\}/g, (_, token) => {
      tokens.add(token);
      return _;
    });
    return Array.from(tokens).sort();
  };

  const enBase = UI_STRINGS.en?.inventory || {};
  const expectedKeys = Object.keys(enBase);
  const locales = Object.keys(UI_STRINGS || {}).filter((lang) => lang !== 'en');

  for (const lang of locales) {
    const locale = UI_STRINGS[lang]?.inventory || {};
    const missing = expectedKeys.filter((key) => {
      const value = locale[key];
      return value === undefined || value === null || value === '';
    });

    if (missing.length) {
      console.warn(`[Inventory i18n] Missing keys for ${lang}:`, missing);
    }

    const extra = Object.keys(locale).filter((key) => !expectedKeys.includes(key));
    if (extra.length) {
      console.warn(`[Inventory i18n] Extra keys for ${lang}:`, extra);
    }

    const placeholderMismatch = [];
    for (const key of expectedKeys) {
      const enTokens = placeholderTokens(enBase[key]);
      const localeTokens = placeholderTokens(locale[key]);
      if (enTokens.join('|') !== localeTokens.join('|')) {
        placeholderMismatch.push({ key, en: enTokens, locale: localeTokens });
      }
    }
    if (placeholderMismatch.length) {
      console.warn(`[Inventory i18n] Placeholder mismatch for ${lang}:`, placeholderMismatch);
    }
  }
}

function renderTopMenuNav() {
  const nav = $('topMenuNav');
  if (!nav) return;
  nav.innerHTML = '';

  for (const menu of state.menus || []) {
    if (isInventoryMenu(menu)) continue;

    const isActive = menu.key === state.menuKey;
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'topMenuItem' + (isActive ? ' active' : '');
    if (isActive) button.setAttribute('aria-current', 'page');

    const icon = document.createElement('span');
    icon.className = 'menuIcon';
    icon.innerHTML = menuIconSvg(menu);
    const label = document.createElement('span');
    label.className = 'menuLabel';
    label.textContent = topMenuLabel(menu);
    button.appendChild(icon);
    button.appendChild(label);

    const enabled = hasMenuCsv(menu);
    if (!enabled) {
      button.disabled = true;
      button.title = t('comingSoon');
    } else {
      button.onclick = async () => {
        await setMenu(menu.key);
      };
    }

    nav.appendChild(button);
  }
}

function bindSettingsMenu() {
  if (settingsMenuBound) return;

  const settingsBtn = $('settingsBtn');
  const settingsPanel = $('settingsPanel');
  const settingsThemeBtn = $('settingsThemeBtn');
  const settingsBackToMenuBtn = $('settingsBackToMenuBtn');
  const settingsLogoutBtn = $('settingsLogoutBtn');
  if (!settingsBtn || !settingsPanel || !settingsThemeBtn || !settingsBackToMenuBtn || !settingsLogoutBtn) return;

  settingsBtn.addEventListener('click', (e) => {
    e.preventDefault();
    const isOpen = settingsPanel.classList.contains('open');
    if (isOpen) {
      closeSettingsMenu();
      return;
    }
    settingsPanel.classList.add('open');
    settingsPanel.setAttribute('aria-hidden', 'false');
    settingsBtn.setAttribute('aria-expanded', 'true');
  });

  settingsThemeBtn.addEventListener('click', () => {
    toggleTheme();
    closeSettingsMenu();
  });

  settingsBackToMenuBtn.addEventListener('click', () => {
    closeSettingsMenu();
    goBackToMenuSelection();
  });

  settingsLogoutBtn.addEventListener('click', () => {
    closeSettingsMenu();
    const logoutBtn = $('logoutBtn');
    if (logoutBtn) logoutBtn.click();
  });

  document.addEventListener('click', (e) => {
    const panel = $('settingsPanel');
    const btn = $('settingsBtn');
    if (!panel || !btn) return;
    if (!panel.classList.contains('open')) return;
    if (panel.contains(e.target) || btn.contains(e.target)) return;
    closeSettingsMenu();
  });

  settingsMenuBound = true;
}

function normalizeAssetPath(path) {
  if (!path) return '';
  if (path.startsWith('http://') || path.startsWith('https://') || path.startsWith('data:')) return path;
  
  // Always use absolute path from /winegallery/ root since Pretty URLs can interfere with relative paths
  // For example: when URL is /novikov_bh, relative paths like assets/... become /novikov_bh/assets/
  if (path.startsWith('/')) {
    // Already absolute - check if it starts with /winegallery/, if not prepend it
    if (!path.startsWith('/winegallery/')) {
      return '/winegallery' + path;
    }
    return path;
  }
  
  // For relative paths like "assets/novikov-logo.png", prepend /winegallery/
  const fullPath = '/winegallery/' + path;
  return fullPath;
}

function normalizeSectionKey(input) {
  const raw = String(input ?? '').trim();
  if (!raw) return '';
  const noDiacritics = raw.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const lowered = noDiacritics.toLowerCase();
  const cleaned = lowered.replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
  return cleaned;
}

function safe(v) {
  if (v === null || v === undefined) return '';
  return String(v);
}

function normalizePriceRaw(v) {
  return String(v ?? '')
    .replace(/\u00A0/g, ' ')
    .trim();
}

function isMissingPrice(v) {
  const raw = normalizePriceRaw(v);
  if (!raw) return true;
  const key = raw.toLowerCase();
  return key === 'n/a' || key === 'na' || key === 'null' || key === 'none' || key === '-' || key === '--';
}

function getDisplayPrice(v) {
  if (isMissingPrice(v)) return '';
  return money(normalizePriceRaw(v));
}

function hasDisplayPrice(v) {
  return !!getDisplayPrice(v);
}

function hasAnyDisplayPrice(w) {
  return hasDisplayPrice(w?.priceBottle) || hasDisplayPrice(w?.priceGlass);
}

let wineNameFitRaf = null;

function fitSingleLineElements(elements, maxFont, preferredMin, floorMin) {
  for (const el of elements) {
    el.style.fontSize = `${maxFont}px`;
    el.style.letterSpacing = '0px';
    el.style.whiteSpace = 'nowrap';

    let size = maxFont;
    while (el.scrollWidth > el.clientWidth && size > preferredMin) {
      size -= 0.5;
      el.style.fontSize = `${size}px`;
    }

    let spacing = 0;
    while (el.scrollWidth > el.clientWidth && spacing > -0.8) {
      spacing -= 0.1;
      el.style.letterSpacing = `${spacing.toFixed(1)}px`;
    }

    while (el.scrollWidth > el.clientWidth && size > floorMin) {
      size -= 0.25;
      el.style.fontSize = `${size}px`;
    }
  }
}

function fitWineNameSingleLine() {
  const isMobile = window.matchMedia('(max-width: 767px)').matches;
  fitSingleLineElements(
    document.querySelectorAll('#grid .card:not(.pastryCard) .titleWine'),
    16,
    isMobile ? 10 : 11,
    8
  );
  fitSingleLineElements(
    document.querySelectorAll('#grid .card:not(.pastryCard) .titleProducer'),
    16,
    isMobile ? 10 : 11,
    8
  );

  const modalProducer = document.querySelector('#modalProducer');
  if (modalProducer && modalProducer.textContent.trim()) {
    fitSingleLineElements([modalProducer], 27, 17, 11);
  }

  const modalName = document.querySelector('#modalName');
  if (modalName && modalName.textContent.trim()) {
    fitSingleLineElements([modalName], 16, 11, 8);
  }

  const modalCountry = document.querySelector('#modalCountry');
  if (modalCountry && modalCountry.textContent.trim()) {
    fitSingleLineElements([modalCountry], 14, 10, 8);
  }
}

function scheduleWineNameFit() {
  if (wineNameFitRaf) cancelAnimationFrame(wineNameFitRaf);
  wineNameFitRaf = requestAnimationFrame(() => {
    wineNameFitRaf = null;
    fitWineNameSingleLine();
  });
}

function money(v) {
  const n = Number(v);
  if (!isFinite(n)) return '';
  const currency = state.config?.currency || 'USD';
  try {
    const formatted = new Intl.NumberFormat('en-US', {
      style: 'currency',
      currency: currency,
      minimumFractionDigits: 0,
      maximumFractionDigits: 0
    }).format(n);
    return formatted.replace('$', '$ ');
  } catch (e) {
    return `$ ${n}`;
  }
}

  const themeVars = theme === 'dark' ? darkTheme : lightTheme;
  const root = document.documentElement;
  for (const [key, value] of Object.entries(themeVars)) {
    root.style.setProperty(key, value);
  }
}

  const savedTheme = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  applyTheme(savedTheme);
  updateThemeButton(savedTheme);
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const newTheme = current === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', newTheme);
  applyTheme(newTheme);
  localStorage.setItem('theme', newTheme);
  updateThemeButton(newTheme);
}

    btn.textContent = theme === 'light' ? '🌙' : '☀️';

/**
 * Keeps sticky offsets for section tabs in sync with the actual
 * topbar / tabs heights, so wrapped tabs or a wrapped mobile topbar
 * never overlap the rows below them.
 */
function syncStickyOffsets() {
  const root = document.documentElement;
  const topbar = document.querySelector('.topbar');
  const tabs = $('sectionTabs');
  if (topbar) {
    root.style.setProperty('--topbar-h', Math.round(topbar.getBoundingClientRect().height) + 'px');
  }
  if (tabs && !tabs.classList.contains('hidden')) {
    root.style.setProperty('--tabs-h', Math.round(tabs.getBoundingClientRect().height) + 'px');
  } else {
    root.style.setProperty('--tabs-h', '0px');
  }
}

function initStickyOffsets() {
  syncStickyOffsets();
  if (typeof ResizeObserver !== 'undefined') {
    const ro = new ResizeObserver(() => syncStickyOffsets());
    const topbar = document.querySelector('.topbar');
    const tabs = $('sectionTabs');
    if (topbar) ro.observe(topbar);
    if (tabs) ro.observe(tabs);
  }
  window.addEventListener('resize', syncStickyOffsets);
}

 * =========================
 */
function shouldUseHashRouting() {
  return window.location.hostname === '127.0.0.1'
    || window.location.hostname === 'localhost'
    || window.location.protocol === 'file:';
}

function readRoute() {
  const u = new URL(window.location.href);
  const p = u.searchParams;
  const cleanPath = u.pathname.replace(/\/index\.html$/i, '').replace(/\/$/, '');
  const parts = cleanPath.split('/').filter(Boolean);
  const hashParts = (u.hash && u.hash.startsWith('#/')) ? u.hash.slice(2).split('/').filter(Boolean) : [];
  
  // Skip folder name (e.g., 'winegallery'), take the rest
  let pathRestaurant = null;
  let pathMenu = null;
  
  if (hashParts.length) {
    pathRestaurant = hashParts[0] || null;
    pathMenu = hashParts[1] || null;
  } else if (parts.length >= 1) {
    // If last part is a known folder name, skip it
    const lastPart = parts[parts.length - 1];
    if (lastPart === 'winegallery') {
      // Root path like /winegallery/, parts after folder
      pathRestaurant = parts.length > 1 ? parts[parts.length - 2] : null;
      pathMenu = parts.length > 2 ? parts[parts.length - 3] : null;
    } else if (parts.length >= 1) {
      // Direct path like /novikov or /novikov/wine
      pathRestaurant = parts[0];
      pathMenu = parts[1] || null;
    }
  }

  return {
    r: pathRestaurant || p.get('r'),
    menu: (pathMenu === 'inventory' ? INVENTORY_MENU_KEY : pathMenu) || p.get('menu'),
    section: normalizeSectionKey(p.get('section')),
    w: p.get('w')
  };
}

function buildPath(r, menu) {
  if (shouldUseHashRouting()) {
    const bp = getBasePath();
    const base = bp.endsWith('/') ? bp : `${bp}/`;
    if (!r) return base;
    const routeMenu = menu === INVENTORY_MENU_KEY ? 'inventory' : menu;
    const suffix = routeMenu ? `${r}/${routeMenu}` : `${r}`;
    return `${base}#/${suffix}`;
  }
  if (!r) return '/';
  const routeMenu = menu === INVENTORY_MENU_KEY ? 'inventory' : menu;
  if (!routeMenu) return `/${r}`;
  return `/${r}/${routeMenu}`;
}

function writeUrlParams(next, mode = 'replace') {
  const u = new URL(window.location.href);
  const p = u.searchParams;

  const targetRestaurant = next.r !== undefined ? next.r : state.restaurantId;
  const targetMenu = next.menu !== undefined ? next.menu : state.menuKey;

  p.delete('r');
  p.delete('menu');
  if (next.section !== undefined) {
    if (next.section) p.set('section', next.section); else p.delete('section');
  }
  if (next.w !== undefined) {
    if (next.w) p.set('w', next.w); else p.delete('w');
  }

  const newPath = buildPath(targetRestaurant, targetMenu);
  const newUrl = newPath + (p.toString() ? '?' + p.toString() : '');

  if (mode === 'push') history.pushState(null, '', newUrl);
  else history.replaceState(null, '', newUrl);
}

function syncUrl(mode = 'replace') {
  writeUrlParams({
    r: state.restaurantId,
    menu: state.menuKey,
    section: state.activeSection,
    w: state.modalWineId
  }, mode);
}

function getDefaultSubsection(sectionKey) {

}

/**
 * =========================
 * 3) CSV parsing + mapping
 * =========================
 */
function parseCSV(text) {
  const rows = [];
  let row = [];
  let cur = '';
  let inQ = false;

  for (let i=0; i<text.length; i++) {
    const ch = text[i];
    const next = text[i+1];

    if (inQ) {
      if (ch === '"' && next === '"') { cur += '"'; i++; }
      else if (ch === '"') inQ = false;
      else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ',') { row.push(cur); cur=''; }
      else if (ch === '\n') { row.push(cur); rows.push(row); row=[]; cur=''; }
      else if (ch === '\r') { /* ignore */ }
      else cur += ch;
    }
  }
  if (cur.length || row.length) { row.push(cur); rows.push(row); }

  return rows;
}

function csvToObjects(csvText) {
  const rows = parseCSV(csvText);
  if (!rows.length) return [];
  const headers = rows[0].map(h => safe(h).trim());
  const objects = [];

  for (let i=1; i<rows.length; i++) {
    const r = rows[i];
    const obj = {};
    for (let j=0; j<headers.length; j++) {
      const key = headers[j];
      const value = r[j] ?? '';
      obj[key] = value;
      const lowerKey = key.toLowerCase();
      if (!obj.hasOwnProperty(lowerKey)) {
        obj[lowerKey] = value;
      }
    }
    objects.push(obj);
  }
  return objects;
}

function toBool(v) {
  const s = String(v ?? '')
    .replace(/\u00A0/g, ' ')
    .trim()
    .toLowerCase();

  if (s === '') return true;
  return ['1', 'true', 'yes', 'y', 'on'].includes(s);
}

function buildSearchHaystack(parts) {
  return parts
    .map(v => String(v ?? '').replace(/\u00A0/g, ' ').trim().toLowerCase())
    .filter(Boolean)
    .join(' ');
}

function parseNotesChips(s) {
  const raw = String(s || '')
    .split(/[|,;]/g)
    .map(x => x.trim().replace(/_/g, ' '))
    .filter(Boolean);

  const seenRaw = new Set();
  const resolved = [];

  raw.forEach((item, sourceOrder) => {
    const rawKey = item.toLowerCase();
    if (seenRaw.has(rawKey)) return;
    seenRaw.add(rawKey);

    const token = resolveTokenEntry(item);
    if (!token || !token.icon) return;
    if (resolved.some(x => x.key === token.key)) return;

    const priority = NOTE_PRIORITY_INDEX.has(token.key)
      ? NOTE_PRIORITY_INDEX.get(token.key)
      : Number.MAX_SAFE_INTEGER;

    resolved.push({ key: token.key, priority, sourceOrder });
  });

  resolved.sort((a, b) => {
    if (a.priority !== b.priority) return a.priority - b.priority;
    return a.sourceOrder - b.sourceOrder;
  });

  return resolved.slice(0, 3).map(x => x.key);
}


function buildShortDescription(text) {
  const raw = String(text || '').replace(/\s+/g, ' ').trim();
  if (!raw) return '';
  const cleaned = raw.replace(/^this wine\s+(is|offers|presents|delivers)\s+/i, '');
  const sentences = cleaned.split(/(?<=[.!?])\s+/).filter(Boolean);
  return sentences.slice(0, 3).join(' ');
}

function buildCardChips(w) {
  const chips = [];
  const section = labelForSectionKey(w.sectionKey);
  if (section) chips.push(section);
  if (chips.length < 2 && safe(w.grape)) chips.push(w.grape);

  const seen = new Set();
  const out = [];
  for (const c of chips) {
    const key = String(c || '').toLowerCase();
    if (!key || seen.has(key)) continue;
    seen.add(key);
    out.push(c);
    if (out.length >= 2) break;
  }
  return out;
}

function buildPairingList(text) {
  const raw = String(text || '')
    .split(/[|,;/]/g)
    .map(x => x.trim())
    .filter(Boolean);
  return raw.slice(0, 4);
}

function getNoteTokensForWine(w) {
  return parseNotesChips(w.notes);
}

function readProfileValue(raw, keys) {
  for (const key of keys) {
    if (raw && raw[key] !== undefined && raw[key] !== null) {
      const val = Number(String(raw[key]).replace(',', '.'));
      if (isFinite(val)) {
        if (val <= 5) return Math.max(0, Math.min(100, (val - 1) * 25));
        return Math.max(0, Math.min(100, val));
      }
    }
  }
  return null;
}

function inferProfile(sectionKey = '') {
  const key = String(sectionKey || '').toLowerCase();
  if (key.includes('red')) {
    return { body: 72, acidity: 55, sweetness: 12, texture: 72, textureLabel: ['Smooth', 'Firm'] };
  }
  if (key.includes('sparkling') || key.includes('champagne')) {
    return { body: 30, acidity: 72, sweetness: 22, texture: 28, textureLabel: ['Crisp', 'Creamy'] };
  }
  if (key.includes('rose')) {
    return { body: 42, acidity: 60, sweetness: 18, texture: 40, textureLabel: ['Crisp', 'Creamy'] };
  }
  if (key.includes('dessert')) {
    return { body: 62, acidity: 40, sweetness: 82, texture: 60, textureLabel: ['Crisp', 'Creamy'] };
  }
  return { body: 38, acidity: 64, sweetness: 12, texture: 36, textureLabel: ['Crisp', 'Creamy'] };
}

function getWineProfile(w) {
  const raw = w?.raw || {};
  const base = inferProfile(w.sectionKey);
  const body = readProfileValue(raw, ['body', 'body_level', 'profile_body']) ?? base.body;
  const acidity = readProfileValue(raw, ['acidity', 'acidity_level', 'profile_acidity']) ?? base.acidity;
  const sweetness = readProfileValue(raw, ['sweetness', 'sweetness_level', 'profile_sweetness']) ?? base.sweetness;
  const texture = readProfileValue(raw, ['texture', 'texture_level', 'profile_texture']) ?? base.texture;
  return { body, acidity, sweetness, texture, textureLabel: base.textureLabel };
}

const TOKEN_DICTIONARY = NOTE_ICON_FILES.reduce((acc, file) => {
  const raw = file.replace(/\.png$/i, '').replace(/_/g, ' ').toLowerCase();
  const label = raw.replace(/(^|[\s-])\w/g, (m) => m.toUpperCase());
  acc[raw] = { label, icon: file };
  return acc;
}, {});

// Единый глобальный приоритет показа нот для всех карточек и языков.
// Базируется на текущих данных меню: сначала фруктовый профиль,
// затем цветочные/травяные/пряные, затем минерально-землистые и выдержка.
const NOTE_PRIORITY_ORDER = [
  'citrus',
  'tree fruit',
  'tropical fruit',
  'floral',
  'red fruit',
  'black fruit',
  'dried fruit',
  'herbal',
  'savory herb',
  'green pepper',

  'cocoa',

  'umami',
  'pungent',
  'burnt',
  'chemical',
  'sulfur',
];

const NOTE_PRIORITY_INDEX = new Map(
  NOTE_PRIORITY_ORDER.map((key, idx) => [key, idx])
);

function resolveTokenEntry(tokenStr) {
  const normalized = String(tokenStr || '').toLowerCase().trim();
  if (!normalized) return null;

  if (TOKEN_DICTIONARY[normalized]) {
    return { key: normalized, ...TOKEN_DICTIONARY[normalized] };
  }

  return null;
}

function buildNoteTag(tokenData) {
  const container = document.createElement('div');

    const icon = document.createElement('img');
    icon.src = iconPath;
    icon.alt = tokenData.label;
    icon.className = 'noteIcon';
    container.appendChild(icon);
  }
  
  const label = document.createElement('span');
  label.textContent = tokenData.label;
  label.className = 'noteLabel';
  container.appendChild(label);
  
  return container;
}

function getTokenDisplay(tokenStr, lang = 'en') {
  const token = resolveTokenEntry(tokenStr);
  if (!token) return null;
  return {

  };
}

/**
 * =========================
 * 4) Data loading (configs + CSV) + caching
 * =========================
 */
async function fetchJson(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status} for ${url}`);
  return await res.json();
}

async function fetchText(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status} for ${url}`);
  return await res.text();
}

function getBasePath() {
  // Используем сохранённый basePath, если он есть
  if (state.basePath !== null) {
    return state.basePath;
  }
  
  // Определяем и сохраняем basePath один раз
  const path = window.location.pathname;
  
  // Если URL содержит /winegallery/, значит index.html по адресу /winegallery/index.html
  // и конфиги находятся в /winegallery/configs/
  if (path.includes('/winegallery/')) {
    state.basePath = '/winegallery/';
    return state.basePath;
  }
  
  // Если сервер запущен из папки winegallery, конфиги в /configs/
  state.basePath = '/';
  return state.basePath;
}

async function loadConfigsIndex() {
  if (state.cache.configsIndex) return state.cache.configsIndex;
  const basePath = getBasePath();
  const idx = await fetchJson(`${basePath}configs/index.json`);
  state.cache.configsIndex = idx;
  return idx;
}

async function loadRestaurantConfig(restaurantId) {
  if (state.cache.configByRestaurant.has(restaurantId)) return state.cache.configByRestaurant.get(restaurantId);
  const basePath = getBasePath();
  const cfg = await fetchJson(`${basePath}configs/${restaurantId}.json`);
  state.cache.configByRestaurant.set(restaurantId, cfg);
  return cfg;
}

async function loadCSV(csvUrl) {
  if (state.cache.csvByUrl.has(csvUrl)) return state.cache.csvByUrl.get(csvUrl);
  const text = await fetchText(csvUrl);
  state.cache.csvByUrl.set(csvUrl, text);
  return text;
}

function applyThemeFromConfig(config) {
  const vars = config?.theme?.variables || {};
  const root = document.documentElement;
  for (const [k, v] of Object.entries(vars)) {
    if (!k || !v) continue;
    if (k === '--bg1' || k === '--bg2') continue;
    root.style.setProperty(k, v);
  }
  if (config?.theme?.font) root.style.setProperty('--font', config.theme.font);
}

function getInventoryFeatureConfig(config = state.config) {
  return config?.features?.inventory || null;
}

function isInventoryFeatureEnabled(config = state.config) {
  return !!getInventoryFeatureConfig(config)?.enabled;
}

function isInventoryRouteKey(menuKey) {
  return menuKey === INVENTORY_MENU_KEY;
}

function normalizeMenus(config) {
  if (Array.isArray(config?.menus) && config.menus.length) {
    const inventoryEnabled = isInventoryFeatureEnabled(config);
    const menus = [...config.menus].filter((menu) => {
      if (!inventoryEnabled && isInventoryMenu(menu)) return false;
      return true;
    });

    const hasInventory = menus.some(m => m?.key === INVENTORY_MENU_KEY);
    if (inventoryEnabled && !hasInventory) {
      const inventoryFeature = getInventoryFeatureConfig(config) || {};
      menus.push({
        key: INVENTORY_MENU_KEY,
        title: inventoryFeature.title || 'Inventory Mode',
        type: 'inventory',
        layout: 'inventory'
      });
    }
    return menus;
  }
  if (config?.csvUrl) {
    const menus = [{
      key: 'wine',
      title: 'Wine List',
      type: 'wine',
      layout: 'cards',
      csvUrl: config.csvUrl
    }];
    return menus;
  }
  return [];
}

function getMenuByKey(key) {
  return (state.menus || []).find(m => m.key === key) || null;
}

function getCsvUrlForLang(lang) {
  const menuCsv = state.menuConfig?.csvUrl;
  const fallbackCsv = state.config?.csvUrl;
  const source = menuCsv || fallbackCsv || {};
  return source?.[lang] || source?.en || null;
}

function isInventoryMenu(menu) {
  return !!menu && (menu.key === INVENTORY_MENU_KEY || menu.type === 'inventory' || menu.layout === 'inventory');
}

function isInventoryMode() {

}

const PASTRY_BADGE_LABELS = { V: 'Vegetarian', VE: 'Vegan', GF: 'Gluten-Free' };

function mapPastryRow(x, idx) {
  const title = String(x['name of dish'] ?? x.name ?? x.title ?? '').trim();
  const description = String(x.description ?? '').trim();
  const rawPrice = String(x.price ?? '').replace(',', '.').trim();
  const parsedPrice = Number(rawPrice);
  const priceBottle = isFinite(parsedPrice) ? parsedPrice : '';
  const id = String(x['№'] ?? x.id ?? x.no ?? idx + 1).trim();
  const imageUrl = String(x.primary_image_url ?? x.image ?? '').trim();

  const badges = [];
  for (const raw of String(x.allergies ?? '').split(',')) {
    const token = raw.trim();
    if (!token || token.toUpperCase() === 'N/A') continue;
    if (!badges.includes(token)) badges.push(token);
  }

  return {
    id,
    title,
    description,
    priceBottle,
    imageUrl,
    badges,
    searchHaystack: buildSearchHaystack([title, description]),
    raw: x,
    visible: toBool(x.visible),
    available: toBool(x.is_available),
  };
}

      else startBrand.classList.remove('logoOnly');
    }
    if (startCard) {
      if (isNovikov) startCard.classList.add('logoOnlyScreen');
      else startCard.classList.remove('logoOnlyScreen');
    }
    if (startLogo) {
      startLogo.src = normalizedLogo;
      startLogo.style.display = 'inline-block';
    }
    if (startLockup) {
      startLockup.style.display = 'none';
    }
    if (startTitle) {
      if (isNovikov) {
        startTitle.style.display = 'none';
      } else {
        startTitle.style.display = '';
        startTitle.textContent = state.config?.name || state.restaurantId || 'HOSTERA';
      }
    }
    if (startSubtitle) {
      if (isNovikov) {
        startSubtitle.style.display = 'none';
      } else {
        startSubtitle.style.display = '';
        startSubtitle.textContent = state.config?.branding?.subtitle || '';
      }
    }
  }
  
}

function renderMenuList() {
  const list = $('menuList');
  if (!list) return;
  
  list.innerHTML = '';

  const inventoryMenu = state.menus.find((m) => m?.key === INVENTORY_MENU_KEY);
  const regularMenus = (state.menus || []).filter((m) => !isInventoryMenu(m));

  if (inventoryMenu) {
    const openMenuBtn = document.createElement('button');
    openMenuBtn.type = 'button';
    openMenuBtn.className = 'menuBtn';
    openMenuBtn.textContent = 'Open Menu';

    const menuToOpen = regularMenus.find((m) => m?.key === 'wine')
      || regularMenus.find((m) => !!(m?.csvUrl?.en || m?.csvUrl?.[state.lang]))
      || regularMenus[0];

    if (menuToOpen?.key) {
      openMenuBtn.onclick = () => enterMenu(menuToOpen.key);
    } else {
      openMenuBtn.disabled = true;
      openMenuBtn.textContent = `Open Menu (${t('comingSoon')})`;
    }
    list.appendChild(openMenuBtn);

    const inventoryBtn = document.createElement('button');
    inventoryBtn.type = 'button';
    inventoryBtn.className = 'menuBtn';
    inventoryBtn.textContent = inventoryMenu.title || 'Inventory Mode';
    inventoryBtn.onclick = () => enterMenu(INVENTORY_MENU_KEY);
    list.appendChild(inventoryBtn);
    return;
  }

  for (const menu of regularMenus) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'menuBtn';
    btn.textContent = menuTitleForLang(menu);

    const hasCsv = !!(menu?.csvUrl?.en || menu?.csvUrl?.[state.lang]);
    if (!hasCsv) {
      btn.disabled = true;
      btn.textContent = `${menuTitleForLang(menu)} (${t('comingSoon')})`;
    }

    btn.onclick = () => enterMenu(menu.key);
    list.appendChild(btn);
  }
}

function renderMenuSelect() {
  const ms = $('menuSelect');
  if (!ms) {
    return;
  }
  ms.innerHTML = '';

  for (const menu of state.menus) {
    const opt = document.createElement('option');
    opt.value = menu.key;
    opt.textContent = menuTitleForLang(menu);
    if (menu.key === state.menuKey) opt.selected = true;
    ms.appendChild(opt);
  }

  renderTopMenuNav();
}

function renderGlobalLoginForm() {
  showStartScreen();
  const loginForm = $('loginForm');
  const loginError = $('loginError');
  const loginInput = $('loginInput');
  const passwordInput = $('passwordInput');
  
  loginForm.classList.remove('hidden');
  $('menuList').classList.add('hidden');
  
  // Safely hide restaurant selector and branding elements
  const restaurantSelector = $('restaurantSelector');
  if (restaurantSelector) restaurantSelector.style.display = 'none';
  const startBrand = document.querySelector('.startBrand');
  if (startBrand) startBrand.classList.remove('logoOnly');
  const startCard = document.querySelector('.startCard');
  if (startCard) startCard.classList.remove('logoOnlyScreen');
  
  const startLogo = $('startLogo');
  if (startLogo) startLogo.style.display = 'none';

  const startLockup = $('startLockup');
  if (startLockup) startLockup.style.display = 'none';
  renderHosteraStartLockup();
  
  loginError.textContent = '';
  loginInput.value = '';
  passwordInput.value = '';
  loginInput.placeholder = t('login');
  passwordInput.placeholder = t('password');
  applyLanguageUI();
  
  // Remove old onsubmit handler
  loginForm.onsubmit = async (e) => {
    e.preventDefault();
    loginError.textContent = '';
    
    const login = loginInput.value?.trim() || '';
    const pass = passwordInput.value?.trim() || '';
    
    if (!login || !pass) {
      loginError.textContent = 'Please enter login and password.';
      return;
    }
    
    try {
      const user = await validateGlobalCredentials(login, pass);
      
      if (!user) {
        loginError.textContent = 'Invalid login or password.';
        return;
      }
      
      // Success - load restaurant and proceed
      state.restaurantId = user.restaurantId;
      
      // Don't change URL yet - wait until user selects a menu
      // Changing URL to Pretty URL like /novikov_bh causes browser to try loading that page (404)
      // URL will be updated when user enters a menu via enterMenu()
      state.isLoadingRestaurant = true;
      
      try {
        state.config = await loadRestaurantConfig(state.restaurantId);
      } catch (configErr) {
        console.error('[Login] Config load error:', configErr);
        loginError.textContent = 'Error loading restaurant config: ' + configErr.message;
        return;
      }
      
      applyThemeFromConfig(state.config);
      
      state.menus = normalizeMenus(state.config);
      state.menuKey = null;
      state.menuConfig = null;
      state.lang = 'en';

      applyLanguageUI();
      
      setAuthState(user.role);
      
      loginForm.classList.add('hidden');
      
      // Show menuList and remove aria-hidden from startScreen since content is now visible
      const menuList = $('menuList');
      if (menuList) menuList.classList.remove('hidden');
      
      const startScreen = $('startScreen');
      if (startScreen) {
        startScreen.setAttribute('aria-hidden', 'false');
      }
      
      // Don't hide startScreen - menuList is inside it!
      // If we hide startScreen, menuList will be hidden too
      // Keep startScreen visible for menu selection
      
      renderStartBranding();

      renderMenuSelect();
      bindSettingsMenu();
      
      renderMenuList();

      bindLogoutHandler();

      $('logoutBtn').style.display = 'inline-flex';
      
      setStatus(t('ready'), 'good');
    } catch (err) {
      console.error('[Login] Error:', err);
      loginError.textContent = 'Error: ' + err.message;
    }
  };
}


function requiresAuth(config) {
  return config?.auth?.mode === 'local' && Array.isArray(config?.auth?.users) && config.auth.users.length > 0;
}

async function validateGlobalCredentials(login, password) {
  try {
    const basePath = getBasePath();
    const authUrl = `${basePath}configs/auth.json?v=` + Date.now();
    const authIndex = await fetchJson(authUrl);
    const user = authIndex.users?.find(u => u.login === login && u.password === password);
    return user || null;
  } catch (e) {
    console.error('[Auth] Error loading auth config:', e);
    throw e;
  }
}

function validateCredentials(login, password) {
  const users = state.config?.auth?.users || [];
  return users.find(u => u.login === login && u.password === password) || null;
}

async function enterMenu(menuKey) {
  if (!menuKey) return;
  const wasInventoryMode = isInventoryMode();
  const nextMenu = getMenuByKey(menuKey);
  const nextIsInventoryMode = isInventoryMenu(nextMenu);
  if (!wasInventoryMode && nextIsInventoryMode) {
    resetWineSearchState();
  }
  if (isInventoryRouteKey(menuKey) && !isInventoryFeatureEnabled()) {
    showStartScreen();
    renderMenuList();
    return;
  }

  if (!nextMenu) {
    showStartScreen();
    renderMenuList();
    return;
  }

  state.menuKey = menuKey;
  state.menuConfig = nextMenu;

  renderMenuSelect();

  // Set topbar branding (logo and restaurant name)
  const brandLogo = state.config?.branding?.logo || state.config?.logoUrl || '';
  $('restaurantName').textContent = state.config.name || state.restaurantId;
  $('logo').src = normalizeAssetPath(brandLogo);
  $('logo').style.display = brandLogo ? 'inline-block' : 'none';
  
  showAppScreen();

  writeUrlParams({ menu: menuKey, w: null, section: null }, 'push');

  if (isInventoryMode()) {
    await renderInventoryMode();
    renderTopMenuNav();
    return;
  }

  if (wasInventoryMode) {
    resetWineSearchState();
  }

  showWineView();
  
  // Форсируем загрузку данных, даже если язык не изменился
  state.wines = [];
  await loadWinesForCurrentMenu();
}

async function loadWinesForCurrentMenu() {
  if (isInventoryMode()) {
    await renderInventoryMode();
    return;
  }

  if (!state.menuKey) {
    return;
  }

  const csvUrl = getCsvUrlForLang(state.lang);
  
  if (!csvUrl) {
    setStatus(t('menuNotConfigured'), 'idle');
    return;
  }

  try {
    setStatus(t('loadingWines'), 'idle');
    const csvText = await loadCSV(csvUrl);
    
    const raw = csvToObjects(csvText);

    if (isPastryMode()) {
      state.wines = raw
        .map((x, idx) => mapPastryRow(x, idx))
        .filter((w) => w.id && w.title)
        .filter((w) => w.visible);

      state.sectionsEffective = [];
      state.activeSection = 'all';

      setStatus(t('ready'), 'good');
      filterAndRender();
      return;
    }

    function toNum(v) {
      const n = Number(String(v ?? '').replace(',', '.').trim());
      return isFinite(n) ? n : null;
    }
    
    function buildTitle(x) {
      const producer = String(x.producer ?? '').trim();
      const name = String(x.name ?? '').trim();
      const vintage = String(x.vintage ?? '').trim();
      const base = [producer, name].filter(Boolean).join(' ');
      return [base, vintage].filter(Boolean).join(' ');
    }
    
    function buildSub(x) {
      const country = String(x.country ?? '').trim();
      const region = String(x.region ?? '').trim();
      const subregion = String(x['sub-region'] ?? x.subregion ?? '').trim();
      const grape = String(x.grape ?? '').trim();
      const regionDisplay = [region, subregion].filter(Boolean).join(' | ');
      return [country, regionDisplay, grape].filter(Boolean).join(' • ');
    }

    state.wines = raw
      .map(x => {
        const section = String(x.section ?? x.section_key ?? '').trim();
        const sectionKeyRaw = String(x.section_key ?? '').trim();
        const sectionKey = normalizeSectionKey(sectionKeyRaw || section);

        const visible = toBool(x.visible);
        const available = toBool(x.is_available);

        const producer = String(x.producer ?? '').trim();
        const country = String(x.country ?? '').trim();
        const region = String(x.region ?? '').trim();
        const subregion = String(x['sub-region'] ?? x.subregion ?? '').trim();
        const grape = String(x.grape ?? '').trim();

        const hay = buildSearchHaystack([
          buildTitle(x),
          producer,
          country,
          region,
          subregion,
          grape
        ]);

        return {
          id: String(x['№'] ?? x.id ?? x.wine_id ?? '').trim(),
          title: buildTitle(x),
          sub: buildSub(x),

          section,
          sectionKey,

          producer,
          country,
          region,
          subregion,
          grape,
          searchHaystack: hay,

          description: String(x.story ?? x.description ?? '').trim(),
          notes: String(x.notes ?? x.notes_profile ?? '').trim(),
          pairing: String(x.pairing ?? '').trim(),

          imageUrl: String(x.bottle_img ?? x.primary_image_url ?? '').trim(),
          priceGlass: x.btg_price ?? '',
          priceBottle: x.bottle_price ?? '',

          subsectionKey: normalizeSectionKey(String(x['subsection_key '] ?? x.subsection_key ?? '').trim()),
          subsectionLabel: String((x['subsection_key '] ?? x.subsection_key ?? '')).trim(),
          btg: String(x.btg ?? '').trim(),

          order: toNum(x.order),
          raw: x,

          visible,
          available,
        };
      })
      .filter(w => w.id && w.title)
      .filter(w => w.visible);

    state.sectionsEffective = computeSectionsEffective(state.wines, state.config, state.lang);
    applyDefaultSectionSelection();

    setStatus(t('ready'), 'good');
    filterAndRender();
    
  } catch (err) {
    console.error('[LoadWines] Error:', err);
    setStatus('Error: ' + err.message, 'idle');
  }
}

async function setMenu(nextMenuKey, opts = {}) {
  const { fromPopstate = false } = opts;
  if (!nextMenuKey || nextMenuKey === state.menuKey) return;
  const wasInventoryMode = isInventoryMode();
  const nextMenu = getMenuByKey(nextMenuKey);
  const nextIsInventoryMode = isInventoryMenu(nextMenu);
  if (!wasInventoryMode && nextIsInventoryMode) {
    resetWineSearchState();
  }

  if (isInventoryRouteKey(nextMenuKey) && !isInventoryFeatureEnabled()) {
    state.menuKey = null;
    state.menuConfig = null;
    showStartScreen();
    $('menuList').classList.remove('hidden');
    renderMenuList();
    if (!fromPopstate) writeUrlParams({ menu: null, w: null, section: null }, 'push');
    return;
  }

  if (!nextMenu) {
    state.menuKey = null;
    state.menuConfig = null;
    showStartScreen();
    $('menuList').classList.remove('hidden');
    renderMenuList();
    return;
  }

  state.menuKey = nextMenuKey;
  state.menuConfig = nextMenu;
  state.activeSection = '';
  state.activeSubsection = '';
  
  // Clear search mode when switching menus
  state.isSearchMode = false;
  state.search = '';
  state.currentDisplaySection = '';
  $('searchInput').value = '';
  syncClearButton();

  renderMenuSelect();

  showAppScreen();

  closeModal(false);
  state.modalWineId = null;

  if (!fromPopstate) {
    writeUrlParams({ menu: nextMenuKey, w: null, section: null }, 'push');
  }

  if (isInventoryMode()) {
    await renderInventoryMode();
    return;
  }

  if (wasInventoryMode) {
    resetWineSearchState();
  }

  showWineView();

  await loadWinesForCurrentMenu();
}

/**
 * =========================
 * 5) Sections logic (Sprint 2.1)
 * =========================
 */
const BTG_KEY = 'by_the_glass';
const BTG_SUBSECTION_ORDER = ['Sparkling wine and Champagne', 'White wine', 'Rose wine', 'Red wine', 'Dessert wine'];

function computeSectionsEffective(wines, config, lang) {
  const labelsFromData = {};
  const keysInData = new Set();

  for (const w of wines) {
    const k = w.sectionKey || normalizeSectionKey(w.section);
    if (k) keysInData.add(k);
    if (k && !labelsFromData[k]) labelsFromData[k] = w.section;
  }

  const labelsFromConfig = {};
  const rawOrderCandidate =
    (config?.sectionsOrderByLang && lang && config.sectionsOrderByLang[lang]) ??
    config?.sectionsOrder;

  const rawOrder = Array.isArray(rawOrderCandidate) ? rawOrderCandidate : [];

  const normalizedOrder = rawOrder
    .map(x => {
      const label = String(x ?? '').trim();
      const key = normalizeSectionKey(label);
      if (key && !labelsFromConfig[key]) labelsFromConfig[key] = label;
      return key;
    })
    .filter(Boolean);

  state.sectionLabels = { ...labelsFromData, ...labelsFromConfig };

  // Применить переопределение названий секций для конкретного языка
  if (config?.sectionLabelsOverride?.[lang]) {
    const override = config.sectionLabelsOverride[lang];
    state.sectionLabels = { ...state.sectionLabels, ...override };
  }

  if (normalizedOrder.length) {
    const hasBtgWines = wines.some(w => w.btg && w.btg !== 'N/A' && w.btg !== '');
    const effective = normalizedOrder.filter(k => k === BTG_KEY ? hasBtgWines : keysInData.has(k));
    if (effective.length === 0 && keysInData.size > 0) {
      console.warn('[WineGallery] sectionsOrder задан, но не совпал ни с одной секцией в CSV. Показываю fallback (All + секции из данных). Проверь названия секций.');
      return Array.from(keysInData);
    }
    return effective;
  }

  return Array.from(keysInData);
}

function sectionAllowed(sectionKey) {
  const order = state.sectionsEffective;
  if (!order || order.length === 0) return true;
  return order.includes(sectionKey);
}

function labelForSectionKey(k) {
  return state.sectionLabels?.[k] || k;
}

function getSubsectionsForSection(sectionKey, wines) {
  if (sectionKey === BTG_KEY) {
    const seen = new Set();
    const result = [];
    for (const w of wines) {
      if (!w.btg || w.btg === 'N/A' || w.btg === '') continue;
      const key = normalizeSectionKey(w.btg);
      if (!seen.has(key)) { seen.add(key); result.push({ key, label: w.btg }); }
    }
    result.sort((a, b) => {
      const ia = BTG_SUBSECTION_ORDER.indexOf(a.label);
      const ib = BTG_SUBSECTION_ORDER.indexOf(b.label);
      return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib);
    });
    return result;
  }
  const seen = new Set();
  const result = [];
  for (const w of wines) {
    if (w.sectionKey !== sectionKey) continue;
    if (!w.subsectionKey) continue;
    if (seen.has(w.subsectionKey)) continue;
    seen.add(w.subsectionKey);
    result.push({ key: w.subsectionKey, label: w.subsectionLabel });
  }
  // Если одна подсекция совпадает с самой секцией — не показываем строку
  if (result.length === 1 && result[0].key === sectionKey) return [];
  return result;
}

/**
 * =========================
 * 6) Rendering
 * =========================
 */
function renderSectionButtons() {
  const tabs = $('sectionTabs');
  const subTabs = $('subsectionTabs');
  if (isPastryMode()) {
    tabs.innerHTML = '';
    tabs.classList.add('hidden');
    subTabs.innerHTML = '';
    subTabs.classList.add('hidden');
    return;
  }
  tabs.classList.remove('hidden');
  tabs.innerHTML = '';

  const addChip = (key, label, active) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (active ? ' active' : '');
    b.textContent = label;
    b.setAttribute('aria-pressed', active ? 'true' : 'false');
    b.onclick = () => setActiveSection(key);
    tabs.appendChild(b);
  };

  // Add "Search" button only if in search mode
  if (state.isSearchMode) {
    const searchBtn = document.createElement('button');
    searchBtn.type = 'button';
    searchBtn.className = 'chip' + (state.currentDisplaySection === 'search' ? ' active' : '');
    searchBtn.textContent = 'Search';
    searchBtn.setAttribute('aria-pressed', state.currentDisplaySection === 'search' ? 'true' : 'false');
    searchBtn.onclick = () => {
      state.currentDisplaySection = 'search';
      filterAndRender();
    };
    tabs.appendChild(searchBtn);

    // Show all sections in search mode but not highlighted
    for (const secKey of state.sectionsEffective) {
      addChip(secKey, labelForSectionKey(secKey), state.currentDisplaySection === secKey);
    }
  } else {
    // Normal mode: show sections and apply section filters
    for (const secKey of state.sectionsEffective) {
      addChip(secKey, labelForSectionKey(secKey), state.activeSection === secKey);
    }
  }

  // Subsection row
  let subsections = [];
  let sectionForSubsections = '';
  
  if (state.isSearchMode) {
    // In search mode: only show subsections if displaying a specific section (not 'search')
    if (state.currentDisplaySection && state.currentDisplaySection !== 'search') {
      sectionForSubsections = state.currentDisplaySection;
      subsections = getSubsectionsForSection(sectionForSubsections, state.wines);
    }
  } else {
    // Normal mode: show subsections based on active section
    sectionForSubsections = state.activeSection;
    subsections = state.activeSection
      ? getSubsectionsForSection(state.activeSection, state.wines)
      : [];
  }

  if (subsections.length > 1) {
    subTabs.classList.remove('hidden');
    subTabs.innerHTML = '';

    const addSubChip = (key, label, active) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (active ? ' active' : '');
      b.textContent = label;
      b.setAttribute('aria-pressed', active ? 'true' : 'false');
      if (state.isSearchMode) {
        // In search mode: clicking subsection updates display
        b.onclick = () => {
          state.activeSubsection = key;
          filterAndRender();
        };
      } else {
        // Normal mode: use regular setActiveSubsection
        b.onclick = () => setActiveSubsection(key);
      }
      subTabs.appendChild(b);
    };

    for (const sub of subsections) {
      const isActive = state.isSearchMode ? state.activeSubsection === sub.key : state.activeSubsection === sub.key;
      addSubChip(sub.key, sub.label, isActive);
    }
  } else {
    subTabs.innerHTML = '';
    subTabs.classList.add('hidden');
  }
}

function renderGrid(list) {

    if (isPastryMode()) {
      const card = document.createElement('div');
      card.className = 'card pastryCard';

      const photo = document.createElement('div');
      photo.className = 'pastryPhoto';

      if (w.imageUrl) {
        const img = document.createElement('img');
        img.className = 'pastryImg';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.src = w.imageUrl;
        img.alt = w.title || 'Dessert image';
        photo.appendChild(img);
      } else {
        const visual = document.createElement('div');
        visual.className = 'pastryVisual';
        visual.textContent = 'Pastry';
        photo.appendChild(visual);
      }
      card.appendChild(photo);

      const body = document.createElement('div');
      body.className = 'pastryBody';

      const titleEl = document.createElement('div');
      titleEl.className = 'pastryTitle';
      titleEl.textContent = safe(w.title);
      body.appendChild(titleEl);

      if (safe(w.description)) {
        const desc = document.createElement('div');
        desc.className = 'pastryDescription';
        desc.textContent = w.description;
        body.appendChild(desc);
      }

      const footer = document.createElement('div');
      footer.className = 'pastryFooter';

      if (safe(w.priceBottle)) {
        const priceValue = document.createElement('span');
        priceValue.className = 'pastryPrice';
        priceValue.textContent = money(w.priceBottle).replace('$ ', '$');
        footer.appendChild(priceValue);
      }

      if (Array.isArray(w.badges) && w.badges.length) {

            icon.innerHTML = iconSvg;

          const label = document.createElement('span');

          badgeEl.appendChild(label);
          badgesWrap.appendChild(badgeEl);

    const meta = document.createElement('div');
    meta.className = 'meta';

    // Producer on first line

      const producerDiv = document.createElement('div');
      producerDiv.className = 'titleProducer';
      producerDiv.textContent = w.producer;
      meta.appendChild(producerDiv);
    }
    
    // Name on second line (without vintage)
    const cardName = safe(w.raw?.name);
    if (cardName) {
      const wineNameDiv = document.createElement('div');
      wineNameDiv.className = 'titleWine';
      wineNameDiv.textContent = cardName;
      meta.appendChild(wineNameDiv);
      
      // Divider after wine name
      const divider1 = document.createElement('div');
      divider1.className = 'divider';
      meta.appendChild(divider1);
    }

    // Info line: Italy | Region | 2024
    const infoParts = [];
    if (w.country) infoParts.push(w.country);
    if (w.region) infoParts.push(w.region);
    if (w.raw?.vintage || w.vintage) infoParts.push(w.raw?.vintage || w.vintage);
    
    if (infoParts.length > 0) {
      const infoLine = document.createElement('div');
      infoLine.className = 'infoLine';
      
      infoParts.forEach((part, idx) => {
        if (idx > 0) {
          const sep = document.createElement('span');
          sep.className = 'sep';
          sep.textContent = '|';
          infoLine.appendChild(sep);
        }
        const textNode = document.createTextNode(part);
        infoLine.appendChild(textNode);
      });
      
      meta.appendChild(infoLine);
    }

    // Price line: Bottle $54 | Glass $15
    const bottlePrice = getDisplayPrice(w.priceBottle);
    const glassPrice = getDisplayPrice(w.priceGlass);
    const hasBottle = !!bottlePrice;
    const hasGlass = !!glassPrice;
    
    if (hasBottle || hasGlass) {
      const priceLine = document.createElement('div');
      priceLine.className = 'priceLine';

      const appendPrice = (labelText, displayValue) => {
        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = labelText;
        priceLine.appendChild(label);

        priceLine.appendChild(document.createTextNode(' '));

        const valueEl = document.createElement('span');
        valueEl.className = 'value';
        valueEl.textContent = displayValue;
        priceLine.appendChild(valueEl);
      };

      if (hasGlass) {
        appendPrice('Glass', glassPrice);
      }

      if (hasBottle && hasGlass) {
        const sep = document.createElement('span');
        sep.className = 'sep';
        sep.textContent = '|';
        priceLine.appendChild(sep);
      }

      if (hasBottle) {
        appendPrice('Bottle', bottlePrice);
      }
      
      meta.appendChild(priceLine);
      
      // Divider after price line
      const divider3 = document.createElement('div');
      divider3.className = 'divider';
      meta.appendChild(divider3);
    }

    // Notes with icons
    if (w.notes) {
      const notesValueWrap = document.createElement('div');
      notesValueWrap.className = 'notes';
      
      const tokens = parseNotesChips(w.notes);
      tokens.forEach(tokenStr => {
        const tokenData = getTokenDisplay(tokenStr);
        if (tokenData && tokenData.icon) {
          const tag = buildNoteTag(tokenData);
          notesValueWrap.appendChild(tag);
        }
      });
      
      meta.appendChild(notesValueWrap);
    }

    layout.appendChild(bottleWrap);
    layout.appendChild(meta);
    card.appendChild(layout);

    const btn = document.createElement('button');
    btn.className = 'cardBtn';
    btn.type = 'button';
    btn.setAttribute('aria-label', `Open wine: ${w.title}`);
    btn.onclick = () => openWineModal(w.id);
    card.appendChild(btn);
    grid.appendChild(card);
  }

  if (!isPastryMode()) {
    scheduleWineNameFit();
  }
}

function filterAndRender() {
  if (isInventoryMode()) return;

  let list = state.wines.slice();
  list = list.filter(w => hasAnyDisplayPrice(w));

  if (state.config?.hide86) {
    list = list.filter(w => w.available);
  }

    // For Pastry mode, skip wine-specific filters and render directly
    if (isPastryMode()) {
      renderSectionButtons();
      renderGrid(list);
      return;
    }

    list = list.filter(w => sectionAllowed(w.sectionKey));

  const q = (state.search || '').trim().toLowerCase();
  
  if (state.isSearchMode) {
    // In search mode
    if (state.currentDisplaySection === 'search') {
      // Display search results from all sections
      if (q) {
        list = list.filter(w => {
          const hay = w.searchHaystack || '';
          return hay.includes(q);
        });
      }
    } else {
      // Display all wines from the selected section (ignore search query)
      if (state.currentDisplaySection === BTG_KEY) {
        list = list.filter(w => w.btg && w.btg !== 'N/A' && w.btg !== '');
        if (state.activeSubsection) {
          list = list.filter(w => normalizeSectionKey(w.btg) === state.activeSubsection);
        }
      } else if (state.currentDisplaySection) {
        list = list.filter(w => w.sectionKey === state.currentDisplaySection);
        if (state.activeSubsection) {
          list = list.filter(w => w.subsectionKey === state.activeSubsection);
        }
      }
    }
  } else {
    // Normal mode: apply section/subsection filters
    if (state.activeSection === BTG_KEY) {
      list = list.filter(w => w.btg && w.btg !== 'N/A' && w.btg !== '');
      if (state.activeSubsection) {
        list = list.filter(w => normalizeSectionKey(w.btg) === state.activeSubsection);
      }
    } else if (state.activeSection) {
      list = list.filter(w => w.sectionKey === state.activeSection);
      if (state.activeSubsection) {
        list = list.filter(w => w.subsectionKey === state.activeSubsection);
      }
    }
  }

  if (isPastryMode()) {
    list.sort((a, b) => {
      const priceA = Number(a.priceBottle) || 0;
      const priceB = Number(b.priceBottle) || 0;
      return priceA - priceB;
    });

    renderSectionButtons();
    renderGrid(list);
    return;
  }

  // Sort by section order and then by price (ascending)
  const sectionOrder = ['sparkling', 'champagne', 'white', 'rose', 'red', 'dessert'];
  list.sort((a, b) => {
    const sectionA = String(a.sectionKey || '').toLowerCase();
    const sectionB = String(b.sectionKey || '').toLowerCase();
    
    const orderA = sectionOrder.indexOf(sectionA);
    const orderB = sectionOrder.indexOf(sectionB);
    
    const indexA = orderA >= 0 ? orderA : 999;
    const indexB = orderB >= 0 ? orderB : 999;
    
    if (indexA !== indexB) {
      return indexA - indexB;
    }
    
    // Within same section, sort by price (ascending)
    const priceA = Number(a.priceBottle) || 0;
    const priceB = Number(b.priceBottle) || 0;
    return priceA - priceB;
  });

  renderSectionButtons();
  renderGrid(list);
}

function setActiveSection(sectionKey) {
  const key = sectionKey || '';
  
  // If in search mode and clicking on a section
  if (state.isSearchMode && key) {
    state.currentDisplaySection = key;
    state.activeSection = key;
    state.activeSubsection = key ? (getDefaultSubsection(key) || '') : '';
    // Don't change state.search, keep the search query active
  } else if (!state.isSearchMode) {
    // Normal mode: apply regular section switching logic
    if (key && !state.sectionsEffective.includes(key)) {
      applyDefaultSectionSelection();
    } else {
      state.activeSection = key;
      state.activeSubsection = key ? (getDefaultSubsection(key) || '') : '';
    }
  }
  
  // Only read search from input if not in search mode (to preserve search in search mode)
  if (!state.isSearchMode) {
    state.search = $('searchInput').value || '';
  }
  
  state.modalWineId = null;
  syncUrl();
  closeModal(false);
  filterAndRender();
  
  // Scroll to top when changing section
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setActiveSubsection(subKey) {
  state.activeSubsection = subKey || getDefaultSubsection(state.activeSection) || '';
  syncUrl();
  filterAndRender();
  
  // Scroll to top when changing subsection
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

let searchTimer = null;
let lastFocusEl = null;
let scrollLockY = 0;

function lockBodyScroll() {
  if (document.body.classList.contains('modalOpen')) return;
  scrollLockY = window.scrollY || window.pageYOffset || 0;

  document.body.style.position = 'fixed';
  document.body.style.top = `-${scrollLockY}px`;
  document.body.style.left = '0';
  document.body.style.right = '0';
  document.body.style.width = '100%';
  document.body.style.overflowY = 'scroll';
  document.body.classList.add('modalOpen');
}

function unlockBodyScroll() {
  if (!document.body.classList.contains('modalOpen')) return;

  const top = document.body.style.top;
  document.body.classList.remove('modalOpen');
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  document.body.style.width = '';
  document.body.style.overflowY = '';

  const restoreY = top ? Math.abs(parseInt(top, 10) || 0) : scrollLockY;
  window.scrollTo(0, restoreY);
}

function openWineModal(wineId, pushHistory = true) {

  const modalPrice = $('modalPrice');

  const modalProfile = $('modalProfile');

  const rows = [
    { label: 'Body', left: 'Light', right: 'Full', value: profile.body },
    { label: 'Acidity', left: 'Soft', right: 'Bright', value: profile.acidity },
    { label: 'Sweetness', left: 'Dry', right: 'Sweet', value: profile.sweetness },

  // Pairing только для PeopleTalk (Task 5.1)

function closeModal(sync=true) {
  const wasOpen = $('modalBack').style.display === 'flex';
  $('modalBack').style.display = 'none';
  unlockBodyScroll();

  if (sync) {
    state.modalWineId = null;
    writeUrlParams({ w: null });
  }

  if (!wasOpen) return;

  setTimeout(() => {
    if (lastFocusEl && typeof lastFocusEl.focus === 'function') {
      lastFocusEl.focus();
    } else {
      const si = $('searchInput');
      if (si) si.focus();
    }
    lastFocusEl = null;
  }, 0);
}

$('modalBack').addEventListener('click', (e) => {
  if (e.target === $('modalBack')) closeModal(true);
});
$('closeModalBtn').addEventListener('click', () => closeModal(true));

function isModalOpen() {
  return $('modalBack').style.display === 'flex';
}

function getFocusableInModal() {
  const modal = $('modalBack').querySelector('.modal');
  return Array.from(modal.querySelectorAll(
    'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
  )).filter(el => !el.hasAttribute('disabled') && el.offsetParent !== null);
}

/* (2) one keydown handler: ESC + focus trap */
document.addEventListener('keydown', (e) => {
  if (!isModalOpen()) return;

  if (e.key === 'Escape') {
    e.preventDefault();
    closeModal(true);
    return;
  }

  if (e.key !== 'Tab') return;

  const focusables = getFocusableInModal();
  if (!focusables.length) return;

  const first = focusables[0];
  const last = focusables[focusables.length - 1];

  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault();
    last.focus();
    return;
  }

  if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
    return;
  }
});
